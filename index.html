<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Controle de Despesas</title>
  <meta name="description" content="Controle de despesas pessoais: cartões, parcelamentos, despesas fixas e projeção futura." />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%234f46e5'/><path d='M9 20l5-5 4 3 6-8' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
  <!-- Tipografia: Plus Jakarta Sans (títulos) + Inter (interface e números tabulares) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">
          <svg viewBox="0 0 32 32"><rect width="32" height="32" rx="9" /><path d="M9 20l5-5 4 3 6-8" /></svg>
        </div>
        <div>
          <div class="brand-name">Controle</div>
          <div class="brand-sub">de despesas</div>
        </div>
      </div>
      <nav class="nav" id="nav">
        <a href="#/" data-route="dashboard"><i data-ic="home"></i>Visão geral</a>
        <a href="#/futuro" data-route="futuro"><i data-ic="trend"></i>Visão futura</a>
        <a href="#/cartoes" data-route="cartoes"><i data-ic="card"></i>Cartões e faturas</a>
        <a href="#/parcelas" data-route="parcelas"><i data-ic="layers"></i>Parcelamentos</a>
        <a href="#/fixas" data-route="fixas"><i data-ic="bolt"></i>Despesas fixas</a>
        <a href="#/lancamentos" data-route="lancamentos"><i data-ic="list"></i>Lançamentos</a>
        <a href="#/importar" data-route="importar"><i data-ic="upload"></i>Importar faturas</a>
        <a href="#/config" data-route="config"><i data-ic="gear"></i>Configurações</a>
      </nav>
      <div class="sidebar-foot">
        <div class="privacy" id="folderStatus"><i data-ic="lock"></i><span>Seus dados ficam só neste navegador.</span></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="icon-btn only-mobile" id="menuBtn" aria-label="Abrir menu"><i data-ic="menu"></i></button>
        <h1 id="pageTitle">Visão geral</h1>
        <div class="topbar-actions">
          <div class="month-picker" id="monthPicker">
            <button class="icon-btn" data-step="-1" aria-label="Mês anterior"><i data-ic="left"></i></button>
            <span id="monthLabel">—</span>
            <button class="icon-btn" data-step="1" aria-label="Próximo mês"><i data-ic="right"></i></button>
          </div>
          <button class="icon-btn" id="bulkDel" aria-label="Excluir lançamentos do mês" title="Excluir lançamentos do mês"><i data-ic="trash"></i></button>
          <button class="icon-btn" id="themeBtn" aria-label="Alternar tema"><i data-ic="moon"></i></button>
          <button class="btn btn-primary" id="quickAdd"><i data-ic="plus"></i><span>Novo gasto</span></button>
        </div>
      </header>
      <section id="view" class="view" tabindex="-1"></section>
    </main>
  </div>

  <dialog id="modal" class="modal"><form method="dialog" id="modalForm"></form></dialog>
  <div id="toast" class="toast" role="status" hidden></div>

  <script src="js/seed.js"></script>
  <script src="js/core.js"></script>
  <script src="js/charts.js"></script>
  <script src="js/parsers.js"></script>
  <script src="js/importer.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
